<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge — Market Data Chat</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2d;
        --input-bg: #1c2945;
        --text: #e9eefc;
        --muted: #9fb0d9;
        --accent: #4fd1c5;
        --accent-dim: #2a8a80;
        --border: #243355;
        --error: #f56565;
        --radius: 12px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at 10% 10%, #1a2b52 0%, var(--bg) 60%);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        width: 100%;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      header h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }

      header .badge {
        font-size: 0.7rem;
        background: var(--accent-dim);
        color: var(--text);
        padding: 2px 8px;
        border-radius: 9999px;
      }

      #chat-container {
        flex: 1;
        width: min(800px, 96vw);
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
        overflow: hidden;
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-right: 4px;
      }

      .msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: var(--radius);
        line-height: 1.5;
        word-wrap: break-word;
        white-space: pre-wrap;
      }

      .msg.user {
        align-self: flex-end;
        background: var(--accent-dim);
        color: var(--text);
        border-bottom-right-radius: 4px;
      }

      .msg.assistant {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      .msg.error {
        align-self: flex-start;
        background: #2d1b1b;
        border: 1px solid var(--error);
        color: var(--error);
      }

      .tool-calls {
        margin-top: 8px;
      }

      .tool-calls details {
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 6px;
      }

      .tool-calls summary {
        padding: 8px 12px;
        cursor: pointer;
        font-size: 0.85rem;
        color: var(--accent);
        user-select: none;
      }

      .tool-calls pre {
        padding: 8px 12px;
        font-size: 0.8rem;
        color: var(--muted);
        overflow-x: auto;
        border-top: 1px solid var(--border);
      }

      #input-area {
        display: flex;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }

      #user-input {
        flex: 1;
        padding: 12px 16px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      #user-input:focus {
        border-color: var(--accent);
      }

      #user-input::placeholder {
        color: var(--muted);
        opacity: 0.6;
      }

      #send-btn {
        padding: 12px 24px;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      #send-btn:hover { opacity: 0.85; }
      #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .loading {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .loading .dots span {
        animation: blink 1.4s infinite both;
        font-size: 1.2rem;
      }
      .loading .dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading .dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes blink {
        0%, 80%, 100% { opacity: 0.2; }
        40% { opacity: 1; }
      }

      #messages::-webkit-scrollbar { width: 6px; }
      #messages::-webkit-scrollbar-track { background: transparent; }
      #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
  </head>
  <body>
    <header>
      <h1>AgentForge</h1>
      <span class="badge">Market Data</span>
    </header>

    <div id="chat-container">
      <div id="messages">
        <div class="msg assistant">
          Hello! I can help you look up stock market data. Try asking about a ticker like AAPL, MSFT, or GOOGL.
        </div>
      </div>

      <div id="input-area">
        <input
          id="user-input"
          type="text"
          placeholder="Ask about a stock price..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <script>
      const API_BASE = (() => {
        // In production, the backend is a separate Railway service.
        // We detect the backend URL from a well-known pattern or fall back.
        const meta = document.querySelector('meta[name="api-base-url"]');
        if (meta) return meta.content.replace(/\/$/, '');
        // Default: same origin (works if proxied) or localhost for dev
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          return 'http://localhost:8000';
        }
        // In Railway, replace frontend domain pattern with backend
        // e.g. agentforge-frontend-xxx.up.railway.app -> look for env-injected URL
        return '';  // Will be set via Railway env or proxy
      })();

      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');

      // Session ID persists across page refreshes within a tab
      if (!sessionStorage.getItem('session_id')) {
        sessionStorage.setItem('session_id', crypto.randomUUID());
      }
      const SESSION_ID = sessionStorage.getItem('session_id');

      function addMessage(role, content, toolCalls) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = content;

        if (toolCalls && toolCalls.length > 0) {
          const tcDiv = document.createElement('div');
          tcDiv.className = 'tool-calls';
          toolCalls.forEach(tc => {
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = `Tool: ${tc.name}(${JSON.stringify(tc.args)})`;
            details.appendChild(summary);

            const pre = document.createElement('pre');
            try {
              pre.textContent = JSON.stringify(JSON.parse(tc.result || '{}'), null, 2);
            } catch {
              pre.textContent = tc.result || 'No result';
            }
            details.appendChild(pre);
            tcDiv.appendChild(details);
          });
          div.appendChild(tcDiv);
        }

        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function showLoading() {
        const div = document.createElement('div');
        div.className = 'loading';
        div.id = 'loading-indicator';
        div.innerHTML = 'Thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function hideLoading() {
        const el = document.getElementById('loading-indicator');
        if (el) el.remove();
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputEl.value = '';
        sendBtn.disabled = true;
        inputEl.disabled = true;
        showLoading();

        try {
          const res = await fetch(`${API_BASE}/agent/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, session_id: SESSION_ID }),
          });

          hideLoading();

          if (!res.ok) {
            addMessage('error', `Server error: ${res.status} ${res.statusText}`);
            return;
          }

          const data = await res.json();
          addMessage('assistant', data.response, data.tool_calls);
        } catch (err) {
          hideLoading();
          addMessage('error', `Connection error: ${err.message}`);
        } finally {
          sendBtn.disabled = false;
          inputEl.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      inputEl.focus();
    </script>
  </body>
</html>
