<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentForge</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111a2d;
        --text: #e9eefc;
        --muted: #9fb0d9;
        --accent: #4fd1c5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: radial-gradient(circle at 10% 10%, #1a2b52 0%, var(--bg) 60%);
        color: var(--text);
        display: grid;
        place-items: center;
      }
      main {
        width: min(720px, 92vw);
        background: color-mix(in oklab, var(--panel) 88%, black);
        border: 1px solid #243355;
        border-radius: 16px;
        padding: 24px;
      }
      h1 { margin-top: 0; }
      code {
        background: #1c2945;
        padding: 2px 6px;
        border-radius: 6px;
      }
      a { color: var(--accent); }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>AgentForge Deployment Baseline</h1>
      <p>Frontend is live on Railway. Backend health endpoint should be available at:</p>
      <p><code>https://&lt;your-railway-domain&gt;/health</code></p>
      <p>Next step: replace this placeholder with the app UI and connect it to your backend API.</p>
      <p><a href="https://github.com/thisisyoussef/agentforge">Repository</a></p>
    </main>
  </body>
</html>
